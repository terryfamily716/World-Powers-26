<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Powers 26</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    #map { height: 58vh; width: 100%; }
    .controls { padding: 10px 12px; background: #1e293b; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid #334155; }
    button { background: #ef4444; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
    button:hover { background: #dc2626; }
    button.blue { background: #3b82f6; }
    button.green { background: #22c55e; }
    button.purple { background: #a855f7; }
    button.orange { background: #fb923c; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .player-info { padding: 10px 16px; background: #1e293b; font-size: 14px; border-bottom: 1px solid #334155; }
    .stats-card { display: none; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px 16px; margin: 10px 12px; font-size: 13px; line-height: 1.7; }
    .stats-card.visible { display: block; }
    .stats-card .stat-name { font-size: 18px; font-weight: 700; color: #facc15; }
    .stats-card .stat-leader { color: #94a3b8; font-style: italic; }
    .stats-card .owned { color: #22c55e; }
    .stats-card .allied { color: #3b82f6; }
    .stats-card .neutral { color: #94a3b8; }
    .crisis-banner { display: none; background: #7f1d1d; border: 1px solid #ef4444; border-radius: 8px; padding: 12px 16px; margin: 10px 12px; font-size: 13px; line-height: 1.6; }
    .crisis-banner.visible { display: block; }
    .crisis-banner .crisis-title { font-size: 16px; font-weight: 700; color: #fca5a5; }
    .vote-row { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .vote-row button { font-size: 12px; padding: 6px 12px; }
    .sanction-banner { display: none; background: #713f12; border: 1px solid #fb923c; border-radius: 8px; padding: 10px 16px; margin: 10px 12px; font-size: 13px; }
    .sanction-banner.visible { display: block; }
    .sanction-banner .sanction-title { font-weight: 700; color: #fdba74; }
    .chokepoint-banner { display: none; background: #1e3a5f; border: 1px solid #38bdf8; border-radius: 8px; padding: 10px 16px; margin: 10px 12px; font-size: 13px; }
    .chokepoint-banner.visible { display: block; }
    .chokepoint-banner .cp-title { font-weight: 700; color: #7dd3fc; }
    .chokepoint-tag { color: #38bdf8; font-weight: 700; }
    .log { background: #0f172a; border-top: 1px solid #334155; padding: 12px; height: 100px; overflow-y: auto; font-size: 13px; }
    .version { position: absolute; top: 8px; right: 8px; z-index: 1000; background: rgba(15,23,42,0.85); color: #FFD700; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 4px; }
    .leaflet-container { background: #0f172a; }
    .claim-cost { color: #fb923c; font-weight: 600; }
    .conflict-tag { color: #f87171; font-weight: 700; }
    .sanctioned { text-decoration: line-through; color: #fb923c; }
    .mil-icon { font-size: 18px; line-height: 1; text-shadow: 0 0 4px rgba(0,0,0,0.9); pointer-events: none; user-select: none; }
  </style>
</head>

    function normalizeId(feature) {
      return feature.properties["ISO_A3"] || feature.properties["iso_a3"] || feature.id || feature.properties["name"];

    function log(msg) {
      const el = document.getElementById("log");
      el.innerHTML = msg + "<br>" + el.innerHTML;

      let h = 0;
      for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % palette.length;
      return palette[h];
    }

    function claimCost(gdp) {
      if (gdp < 500) return 50;
      if (gdp < 2000) return 200;
      if (gdp < 5000) return 350;
      return 500;
    }

    function startingBudget(gdp, pop) {
      const base = Math.round(gdp * 0.02);
      const popBonus = Math.round(pop * 2);
      return Math.max(30, base + popBonus);
    }

    function isSanctioned(id) {
      return activeSanctions.some(function(s) { return s.target === id; });
    }

    function isTariffed(id) {
      return activeTariffs.some(function(t) { return t.target === id; });
    }

    function terrainBonus(id, branch) {
      if (landlocked.has(id)) return branch === "army" ? 1.25 : 0.85;
      if (terrain.navy.indexOf(id) !== -1) return branch === "navy" ? 1.25 : 0.9;
      return 1.0;
    }

    function isChokepointBlocked(id) {
      return activeBlockades.some(function(b) {
        return chokepoints[b.name].countries.indexOf(id) !== -1;
      });
    }

    function styleFeature(feature) {
      const id = normalizeId(feature);
      const c = countries[id];
      const owned = c && c.owner === "You";
      const allied = c && c.owner && c.owner !== "You" && c.relations && c.relations[playerCountry] > 60;
      const selected = c && selectedTarget === id;
      const crisisHit = activeCrisis && activeCrisis.center === id;
      const sanctioned = isSanctioned(id);
      const blocked = isChokepointBlocked(id);
      return {
        fillColor: crisisHit ? "#ef4444" : getColor(id),
        fillOpacity: owned ? 0.75 : (allied ? 0.55 : (crisisHit ? 0.6 : (blocked ? 0.15 : (sanctioned ? 0.2 : 0.35)))),
        color: selected ? "#facc15" : (owned ? "#FFD700" : (allied ? "#3b82f6" : (crisisHit ? "#fca5a5" : (blocked ? "#38bdf8" : (sanctioned ? "#fb923c" : "#64748b"))))),
        weight: selected ? 3 : (owned ? 2.5 : (allied ? 1.5 : (crisisHit ? 2 : (blocked ? 2.5 : (sanctioned ? 1.5 : 0.6))))),
        opacity: 1,
        dashArray: (sanctioned || blocked) ? "6 4" : null
      };
    }

    function updateMilIcons() {
      if (milIconLayer) milIconLayer.clearLayers();
      else milIconLayer = L.layerGroup().addTo(map);
      Object.keys(countries).forEach(function(id) {
        const c = countries[id];
        if (!c.bounds) return;
        const branch = c.branch || "army";
        const icon = branchIcons[branch] || branchIcons.army;
        const size = Math.min(36, 14 + Math.round(c.mil * terrainBonus(id, branch) / 8));
        const cx = (c.bounds.getWest() + c.bounds.getEast()) / 2;
        const cy = (c.bounds.getSouth() + c.bounds.getNorth()) / 2;
        L.marker([cy, cx], {
          icon: L.divIcon({ className: "mil-icon", html: icon, iconSize: [size, size], iconAnchor: [size/2, size/2] })
        }).addTo(milIconLayer);
      });
    }

    function onEachFeature(feature, layer) {
      const id = normalizeId(feature);
      countries[id] = countries[id] || {};
      countries[id].bounds = layer.getBounds();
      countries[id].mil = countries[id].mil || Math.round(20 + Math.random() * 80);
      countries[id].stability = countries[id].stability || Math.round(40 + Math.random() * 50);
      countries[id].branch = countries[id].branch || (terrain.navy.indexOf(id) !== -1 ? "navy" : (landlocked.has(id) ? "army" : ["navy","air","army"][Math.floor(Math.random()*3)]));
      countries[id].budget = countries[id].budget || startingBudget(gdps[id] || 10, populations[id] || 1);
      countries[id].population = populations[id] || 1;
      countries[id].gdp = gdps[id] || 10;
      countries[id].leader = leaders[id] || "Unknown";
      countries[id].gov = govTypes[id] || "Unknown";
      countries[id].relations = countries[id].relations || {};
      layer.on("click", function() { selectCountry(id); });
    }

      selectedTarget = id;
      const c = countries[id];
      if (!c) return;
      if (!playerCountry) {
        playerCountry = id;
        c.owner = "You";
        money = 50000;
        log("You claimed " + id + " for free. Starting budget: $50B. Claim more countries to grow.");
        document.getElementById("player-info").innerHTML = "You: " + id + " | Money: $" + money + "B | Turn: " + turn;
      }
      showStats(id);
      if (geoLayer) geoLayer.setStyle(styleFeature);
      updateMilIcons();
    }

    function showStats(id) {
      const c = countries[id];
      if (!c) return;
      const card = document.getElementById("stats-card");
      card.className = "stats-card visible";
      const owned = c.owner === "You";
      const allied = c.owner && c.owner !== "You" && c.relations && c.relations[playerCountry] > 60;
      const status = owned ? "owned" : (allied ? "allied" : "neutral");
      const cost = claimCost(c.gdp);
      const canClaim = !owned && !allied && money >= cost;
      const branchLabel = c.branch === "navy" ? "Navy" : (c.branch === "air" ? "Air Force" : "Army");
      const tb = terrainBonus(id, c.branch);
      const terrainNote = tb > 1 ? " (terrain bonus: +" + Math.round((tb-1)*100) + "%)" : (tb < 1 ? " (terrain penalty: " + Math.round((tb-1)*100) + "%)" : " (no terrain bonus)");
      card.innerHTML = "<div class=\"stat-name\">" + id + " <button onclick=\"document.getElementById('stats-card').className='stats-card';selectedTarget=null;\" style=\"float:right;background:none;border:none;color:#ef4444;font-size:18px;cursor:pointer;padding:0 4px;\">&times;</button></div>" +
        "<div class=\"stat-leader\">Leader: " + c.leader + " | " + c.gov + "</div>" +
        "<div>GDP: $" + c.gdp + "B | Population: " + c.population + "M | Military: " + c.mil + " | Dominant branch: " + branchLabel + terrainNote + " | Stability: " + c.stability + "%</div>" +
        "<div>Status: <span class=\"" + status + "\">" + status.toUpperCase() + "</span> | Claim cost: <span class=\"claim-cost\">$" + cost + "B</span></div>" +
        (canClaim ? "<button onclick=\"claimCountry('" + id + "')\">Claim Country</button>" : (owned ? "<div class=\"owned\">You own this country</div>" : (allied ? "<div class=\"allied\">Allied with you</div>" : "<div>Not enough money to claim</div>"));
    }

    function claimCountry(id) {
      const c = countries[id];
      if (!c || c.owner) return;
      const cost = claimCost(c.gdp);
      if (money < cost) { log("Not enough money. Need $" + cost + "B, have $" + money + "B."); return; }
      money -= cost;
      c.owner = "You";
      log("Claimed " + id + " for $" + cost + "B. Remaining: $" + money + "B.");
      document.getElementById("player-info").innerHTML = "You: " + playerCountry + " | Money: $" + money + "B | Turn: " + turn;
      showStats(id);
      if (geoLayer) geoLayer.setStyle(styleFeature);
      updateMilIcons();
    }

    function nextTurn() {
      turn++;
      Object.keys(countries).forEach(function(id) {
        const c = countries[id];
        if (c.owner === "You") {
          const income = Math.round(c.population * (c.gdp / c.population) / 100);
          money += income;
        } else if (c.owner) {
          c.budget += Math.round(c.population * 0.5);
        }
        if (c.stability < 100) c.stability = Math.min(100, c.stability + 1);
      });
      if (crisisCooldown > 0) crisisCooldown--;
      else if (Math.random() < 0.15 && !activeCrisis) {
        const ct = crisisTypes[Math.floor(Math.random() * crisisTypes.length)];
        const center = Object.keys(countries)[Math.floor(Math.random() * Object.keys(countries).length)];
        activeCrisis = { type: ct.type, title: ct.title, desc: ct.desc, center: center, turn: turn };
        const cc = countries[center];
        if (cc) { cc.gdp = Math.round(cc.gdp * 0.7); cc.population = Math.round(cc.population * 0.9); cc.stability = Math.max(10, cc.stability - 20); }
        log("CRISIS: " + ct.title + " centered on " + center + ". " + ct.desc);
        showCrisisBanner();
      }
      if (activeCrisis && turn - activeCrisis.turn > 3) {
        activeCrisis = null;
        document.getElementById("crisis-banner").className = "crisis-banner";
      }
      activeSanctions = activeSanctions.filter(function(s) { return turn - s.turn < 4; });
      activeTariffs = activeTariffs.filter(function(t) { return turn - t.turn < 3; });
      activeBlockades = activeBlockades.filter(function(b) { return turn - b.turn < 5; });
      if (activeBlockades.length === 0) {
        document.getElementById("chokepoint-banner").className = "chokepoint-banner";
      } else {
        showChokepointBanner();
      }
      let tollIncome = 0;
      activeBlockades.forEach(function(b) {
        const cp = chokepoints[b.name];
        Object.keys(countries).forEach(function(id) {
          if (countries[id].owner && countries[id].owner !== "You" && cp.countries.indexOf(id) === -1) {
            const hit = Math.round(countries[id].gdp * cp.toll * 0.01);
            tollIncome += hit;
            countries[id].gdp = Math.max(1, countries[id].gdp - hit);
          }
        });
      });
      if (tollIncome > 0) {
        money += tollIncome;
        log("Chokepoint tolls collected: +$" + tollIncome + "B this turn.");
      }
      document.getElementById("player-info").innerHTML = "You: " + playerCountry + " | Money: $" + money + "B | Turn: " + turn;
      if (selectedTarget) showStats(selectedTarget);
      if (geoLayer) geoLayer.setStyle(styleFeature);
      log("Turn " + turn + " complete.");
    }

    function investMilitary() {
      if (!playerCountry) { log("Claim a country first."); return; }
      if (money < 50) { log("Not enough money for military investment."); return; }
      money -= 50;
      const p = countries[playerCountry];
      const branches = ["navy", "air", "army"];
      let best = branches[0], bestB = terrainBonus(playerCountry, branches[0]);
      for (let i = 1; i < branches.length; i++) {
        const b = terrainBonus(playerCountry, branches[i]);
        if (b > bestB) { best = branches[i]; bestB = b; }
      }
      p.branch = best;
      p.mil = Math.round(p.mil * (1.08 * bestB));
      log("Invested $50B in military. Power increased, now emphasizing " + best + " (terrain bonus: " + Math.round((bestB-1)*100) + "%).");
      document.getElementById("player-info").innerHTML = "You: " + playerCountry + " | Money: $" + money + "B | Turn: " + turn;
      updateMilIcons();
      if (selectedTarget) showStats(selectedTarget);
    }

    function attack() {
      if (!playerCountry || !selectedTarget) { log("Select a target country first."); return; }
      if (selectedTarget === playerCountry) { log("Can't attack your own country."); return; }
      const attacker = countries[playerCountry];
      const defender = countries[selectedTarget];
      if (defender.owner === "You") { log("Can't attack your own country."); return; }
      const atkPower = attacker.mil * terrainBonus(playerCountry, attacker.branch) * (attacker.stability / 100);
      const defPower = defender.mil * terrainBonus(selectedTarget, defender.branch) * (defender.stability / 100) * 1.2;
      if (Math.random() < atkPower / (atkPower + defPower)) {
        defender.owner = "You";
        defender.mil = Math.round(defender.mil * 0.5);
        log("VICTORY! Conquered " + selectedTarget + ". Their military halved.");
      } else {
        attacker.mil = Math.round(attacker.mil * 0.8);
        defender.stability = Math.max(10, defender.stability - 10);
        log("DEFEAT. Attack on " + selectedTarget + " failed. Your military took losses.");
      }
      document.getElementById("player-info").innerHTML = "You: " + playerCountry + " | Money: $" + money + "B | Turn: " + turn;
      showStats(selectedTarget);
      if (geoLayer) geoLayer.setStyle(styleFeature);
      updateMilIcons();
    }

    function diplomacy() {
      if (!playerCountry || !selectedTarget || selectedTarget === playerCountry) { log("Select another country for diplomacy."); return; }
      const c = countries[selectedTarget];
      if (!c.relations) c.relations = {};
      c.relations[playerCountry] = (c.relations[playerCountry] || 50) + 15;
      log("Diplomacy improved relations with " + selectedTarget + " to " + c.relations[playerCountry] + ".");
      if (selectedTarget) showStats(selectedTarget);
    }

    function research() {
      if (!playerCountry) { log("Claim a country first."); return; }
      if (money < 100) { log("Not enough money for research."); return; }
      money -= 100;
      const p = countries[playerCountry];
      p.stability = Math.min(100, p.stability + 5);
      p.mil = Math.round(p.mil * 1.05);
      log("Researched new tech. Stability +5, military +5%.");
      document.getElementById("player-info").innerHTML = "You: " + playerCountry + " | Money: $" + money + "B | Turn: " + turn;
      updateMilIcons();
      if (selectedTarget) showStats(selectedTarget);
    }

    function openUN() {
      if (!activeCrisis) { log("No active crisis to vote on."); return; }
      log("UN vote on " + activeCrisis.title + ": passed. " + activeCrisis.center + " stability recovering.");
      const cc = countries[activeCrisis.center];
      if (cc) cc.stability = Math.min(100, cc.stability + 15);
      activeCrisis = null;
      document.getElementById("crisis-banner").className = "crisis-banner";
      if (geoLayer) geoLayer.setStyle(styleFeature);
    }

    function showCrisisBanner() {
      if (!activeCrisis) return;
      const b = document.getElementById("crisis-banner");
      b.className = "crisis-banner visible";
      b.innerHTML = "<div class=\"crisis-title\">" + activeCrisis.title + "</div><div>" + activeCrisis.desc + " Centered on " + activeCrisis.center + ".</div><div class=\"vote-row\"><button onclick=\"openUN()\">Vote UN Resolution</button></div>";
    }

    function showChokepointBanner() {
      const b = document.getElementById("chokepoint-banner");
      if (activeBlockades.length === 0) { b.className = "chokepoint-banner"; return; }
      b.className = "chokepoint-banner visible";
      b.innerHTML = activeBlockades.map(function(bl) {
        const cp = chokepoints[bl.name];
        return "<div class=\"cp-title\">" + bl.name + " BLOCKADED</div><div>" + cp.desc + "</div>";
      }).join("");
    }

    function blockade() {
      if (!playerCountry) { log("Claim a country first."); return; }
      const owned = Object.keys(countries).filter(function(id) { return countries[id].owner === "You"; });
      const options = [];
      Object.keys(chokepoints).forEach(function(name) {
        const cp = chokepoints[name];
        const controlled = cp.countries.filter(function(c) { return owned.indexOf(c) !== -1; });
        if (controlled.length > 0 && !activeBlockades.some(function(b) { return b.name === name; })) {
          options.push(name);
        }
      });
      if (options.length === 0) { log("You don't control any chokepoint countries. Claim one to blockade."); return; }
      const choice = options[0];
      const cp = chokepoints[choice];
      activeBlockades.push({ name: choice, turn: turn });
      log("BLOCKADE: " + choice + " established. " + cp.desc + " Toll: " + Math.round(cp.toll*100) + "% of affected trade.");
      showChokepointBanner();
      if (geoLayer) geoLayer.setStyle(styleFeature);
    }

    function fetchNews() {
      const story = newsPool[Math.floor(Math.random() * newsPool.length)];
      log("NEWS: " + story.headline);
      story.countries.forEach(function(id) {
        const c = countries[id];
        if (!c) return;
        if (story.effect === "gdp_up") c.gdp = Math.round(c.gdp * 1.05);
        else if (story.effect === "gdp_down") c.gdp = Math.round(c.gdp * 0.95);
        else if (story.effect === "stability_up") c.stability = Math.min(100, c.stability + 5);
        else if (story.effect === "mil_up") c.mil = Math.round(c.mil * 1.1);
        else if (story.effect === "pop_down") c.population = Math.round(c.population * 0.98);
      });
      if (selectedTarget) showStats(selectedTarget);
      updateMilIcons();
    }

    map = L.map("map").setView([20, 0], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap", maxZoom: 18 }).addTo(map);
    fetch(GEOJSON_URL)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        geoLayer = L.geoJSON(data, { style: styleFeature, onEachFeature: onEachFeature }).addTo(map);
        map.fitBounds(geoLayer.getBounds());
        updateMilIcons();
        log("Map loaded with " + Object.keys(countries).length + " countries. Tap one to start.");
        log("Russia-Ukraine war LIVE. US-Iran standoff active. UN crises, News, Sanctions, Tariffs, military icons, terrain bonuses, and chokepoints ready.");
      })
      .catch(function(err) {
        log("Failed to load map data: " + err.message);
      });
  </script>
</body>
</html>
