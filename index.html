<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Powers 26</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    #map { height: 58vh; width: 100%; }
    .controls { padding: 10px 12px; background: #1e293b; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid #334155; }
    button { background: #ef4444; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
    button:hover { background: #dc2626; }
    button.blue { background: #3b82f6; }
    button.green { background: #22c55e; }
    button.purple { background: #a855f7; }
    button.orange { background: #fb923c; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .player-info { padding: 10px 16px; background: #1e293b; font-size: 14px; border-bottom: 1px solid #334155; }
    .stats-card { display: none; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px 16px; margin: 10px 12px; font-size: 13px; line-height: 1.7; }
    .stats-card.visible { display: block; }
    .stats-card .stat-name { font-size: 18px; font-weight: 700; color: #facc15; }
    .stats-card .stat-leader { color: #94a3b8; font-style: italic; }
    .stats-card .owned { color: #22c55e; }
    .stats-card .allied { color: #3b82f6; }
    .stats-card .neutral { color: #94a3b8; }
    .crisis-banner { display: none; background: #7f1d1d; border: 1px solid #ef4444; border-radius: 8px; padding: 12px 16px; margin: 10px 12px; font-size: 13px; line-height: 1.6; }
    .crisis-banner.visible { display: block; }
    .crisis-banner .crisis-title { font-size: 16px; font-weight: 700; color: #fca5a5; }
    .vote-row { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .vote-row button { font-size: 12px; padding: 6px 12px; }
    .sanction-banner { display: none; background: #713f12; border: 1px solid #fb923c; border-radius: 8px; padding: 10px 16px; margin: 10px 12px; font-size: 13px; }
    .sanction-banner.visible { display: block; }
    .sanction-banner .sanction-title { font-weight: 700; color: #fdba74; }
    .log { background: #0f172a; border-top: 1px solid #334155; padding: 12px; height: 100px; overflow-y: auto; font-size: 13px; }
    .version { position: absolute; top: 8px; right: 8px; z-index: 1000; background: rgba(15,23,42,0.85); color: #FFD700; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 4px; }
    .leaflet-container { background: #0f172a; }
    .claim-cost { color: #fb923c; font-weight: 600; }
    .conflict-tag { color: #f87171; font-weight: 700; }
    .sanctioned { text-decoration: line-through; color: #fb923c; }
    .mil-icon { font-size: 18px; line-height: 1; text-shadow: 0 0 4px rgba(0,0,0,0.9); pointer-events: none; user-select: none; }
  </style>
</head>
<body>

    <button onclick="research()">Research Tech</button>
    <button onclick="openUN()" class="purple">UN</button>
    <button onclick="fetchNews()" class="orange">News</button>

    function normalizeId(feature) {
      return feature.properties["ISO_A3"] || feature.properties["iso_a3"] || feature.id || feature.properties["name"];
    }

    function log(msg) {
      const el = document.getElementById("log");
      el.innerHTML = msg + "<br>" + el.innerHTML;
    }

    function getColor(id) {
      let h = 0;
      for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % palette.length;
      return palette[h];
    }

    function claimCost(gdp) {
      if (gdp < 500) return 50;
      if (gdp < 2000) return 200;
      if (gdp < 5000) return 350;
      return 500;
    }

    function startingBudget(gdp, pop) {
      const base = Math.round(gdp * 0.02);
      const popBonus = Math.round(pop * 2);
      return Math.max(30, base + popBonus);
    }

    function isSanctioned(id) {
      return activeSanctions.some(function(s) { return s.target === id; });
    }

    function isTariffed(id) {
      return activeTariffs.some(function(t) { return t.target === id; });
    }

    function styleFeature(feature) {
      const id = normalizeId(feature);
      const c = countries[id];
      const owned = c && c.owner === "You";
      const allied = c && c.owner && c.owner !== "You" && c.relations && c.relations[playerCountry] > 60;
      const selected = c && selectedTarget === id;
      const crisisHit = activeCrisis && activeCrisis.center === id;
      const sanctioned = isSanctioned(id);
      return {
        fillColor: crisisHit ? "#ef4444" : getColor(id),
        fillOpacity: owned ? 0.75 : (allied ? 0.55 : (crisisHit ? 0.6 : (sanctioned ? 0.2 : 0.35))),
        color: selected ? "#facc15" : (owned ? "#FFD700" : (allied ? "#3b82f6" : (crisisHit ? "#fca5a5" : (sanctioned ? "#fb923c" : "#64748b")))),
        weight: selected ? 3 : (owned ? 2.5 : (allied ? 1.5 : (crisisHit ? 2 : (sanctioned ? 1.5 : 0.6)))),
        opacity: 1,
        dashArray: sanctioned ? "8,6" : null
      };
    }

    function updateMilIcons() {
      if (milIconLayer) map.removeLayer(milIconLayer);
      const markers = [];
      if (!geoLayer) return;
      geoLayer.eachLayer(function(layer) {
        const id = normalizeId(layer.feature);
        const c = countries[id];
        if (!c || c.mil < 15) return;
        const branch = c.branch || "army";
        const icon = branchIcons[branch];
        const size = Math.min(36, 14 + Math.round(c.mil / 8));
        const bounds = layer.getBounds();
        const center = bounds.getCenter();
        const divIcon = L.divIcon({
          className: "mil-icon",
          html: "<span style=\"font-size:" + size + "px\">" + icon + "</span>",
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2]
        });
        markers.push(L.marker(center, { icon: divIcon, interactive: false }));
      });
      milIconLayer = L.layerGroup(markers).addTo(map);
    }

    function showStats(id) {
      const c = countries[id];
      if (!c) return;
      const card = document.getElementById("stats-card");
      const leader = leaders[id] || "Unknown";
      const gov = govTypes[id] || "Unknown";
      const pop = populations[id] || 0;
      const cost = claimCost(c.gdp);
      let status = "Neutral";
      let statusClass = "neutral";
      if (c.owner === "You") { status = "OWNED"; statusClass = "owned"; }
      else if (c.owner) { status = "Controlled by " + c.owner; statusClass = "allied"; }
      let extra = "";
      if (id === "UKR") extra += "<div class=\"conflict-tag\">LIVE CONFLICT: Russia-Ukraine war ongoing</div>";
      if (id === "IRN") extra += "<div class=\"conflict-tag\">US-IRAN STANDOFF: sanctions draining economy</div>";
      if (c.conflict) extra += "<div class=\"conflict-tag\">In conflict: -" + c.conflictLoss + " mil/turn</div>";
      if (isSanctioned(id)) extra += "<div class=\"conflict-tag\">UNDER SANCTIONS: income halved, stability dropping</div>";
      if (isTariffed(id)) extra += "<div class=\"conflict-tag\">UNDER TARIFFS: exports hit, stability pressure</div>";
      const branchLabel = c.branch === "navy" ? "Navy" : (c.branch === "air" ? "Air Force" : "Army");
      card.innerHTML = "<div class=\"stat-name\">" + c.name + "</div>" +
        "<div class=\"stat-leader\">Leader: " + leader + " | " + gov + "</div>" +
        "<div>GDP: $" + c.gdp + "B | Population: " + (pop >= 1000 ? (pop/1000).toFixed(1) + "B" : pop + "M") + "</div>" +
        "<div>Military: " + c.mil + " | Dominant branch: " + branchLabel + " | Stability: " + c.stability + "%</div>" +
        "<div class=\"" + statusClass + "\">Status: " + status + "</div>" +
        extra +
        (c.owner !== "You" && !c.owner ? "<div class=\"claim-cost\">Claim cost: $" + cost + "B</div><button onclick=\"claimCountry()\" " + (money < cost ? "disabled" : "") + ">Claim for $" + cost + "B</button>" : "");
      card.classList.add("visible");
    }

    function onEachFeature(feature, layer) {
      const id = normalizeId(feature);
      const name = feature.properties["name"] || id;
      const gdp = gdps[id] || Math.round(50 + Math.random() * 450);
      const pop = populations[id] || Math.round(0.5 + Math.random() * 20);
      if (!countries[id]) {
        const branches = ["navy", "air", "army"];
        const branch = branches[Math.floor(Math.random() * branches.length)];
        countries[id] = {
          id: id, name: name, mil: Math.round(20 + Math.random() * 80),
          branch: branch, gdp: gdp, stability: Math.round(30 + Math.random() * 50),
          owner: null, pop: pop, budget: startingBudget(gdp, pop),
          relations: {}, income: 0, conflict: false, conflictLoss: 0, supportRefill: 0,
          tradePartners: []
        };
      }
      layer.on("click", function() {
        showStats(id);
        if (!playerCountry) {
          start(id);
        } else {
          selectedTarget = id;
          geoLayer.setStyle(styleFeature);
          log("Selected " + name);
        }
      });
      layer.bindPopup(name);
    }

      if (geoLayer) geoLayer.setStyle(styleFeature);
      updateMilIcons();
      if (playerCountry) {
        const p = countries[playerCountry];
        let info = "Turn " + turn + " | Playing as <strong>" + p.name + "</strong> | Money: $" + money + "B | Military: " + p.mil + " | Stability: " + p.stability + "%";
        if (activeSanctions.length > 0) info += " | Sanctions active: " + activeSanctions.map(function(s) { return s.target; }).join(", ");
        if (activeTariffs.length > 0) info += " | Tariffs on: " + activeTariffs.map(function(t) { return t.target; }).join(", ");
        document.getElementById("player-info").innerHTML = info;
      }
    }

    function start(id) {
      playerCountry = id;
      const p = countries[id];
      p.owner = "You";
      money = 50;
      log("You now control " + p.name + " (GDP $" + p.gdp + "B, pop " + p.pop + "M). Build your power.");
      render();
      if (geoLayer) {
        const layer = geoLayer.getLayers().find(function(l) {
          return normalizeId(l.feature) === id;
        });
        if (layer) map.fitBounds(layer.getBounds().pad(0.5));
      }
    }

    function generateCrisis() {
      const keys = Object.keys(countries).filter(function(k) { return countries[k].pop > 5; });
      const center = keys[Math.floor(Math.random() * keys.length)];
      const ct = crisisTypes[Math.floor(Math.random() * crisisTypes.length)];
      activeCrisis = {
        type: ct.type, title: ct.title, desc: ct.desc, center: center,
        proposal: "Authorize international aid and stabilization force for " + countries[center].name + ".",
        votes: {}, expires: turn + 1
      };
      const banner = document.getElementById("crisis-banner");
      banner.innerHTML = "<div class=\"crisis-title\">UN CRISIS: " + ct.title + "</div>" +
        "<div>" + ct.desc + " Centered on " + countries[center].name + ".</div>" +
        "<div>" + activeCrisis.proposal + "</div>" +
        "<div class=\"vote-row\">" +
        "<button onclick=\"voteCrisis('yes')\">Vote YES</button>" +
        "<button onclick=\"voteCrisis('no')\">Vote NO</button>" +
        "<button onclick=\"voteCrisis('abstain')\">Abstain</button>" +
        "</div>";
      banner.classList.add("visible");
      log("UN CRISIS declared: " + ct.title + " in " + countries[center].name + ". Security Council may veto.");
    }

    function voteCrisis(vote) {
      if (!activeCrisis) return;
      activeCrisis.votes[playerCountry] = vote;
      log("You voted " + vote.toUpperCase() + " on the UN resolution.");
      const banner = document.getElementById("crisis-banner");
      banner.classList.remove("visible");
      if (vote === "yes") {
        const c = countries[activeCrisis.center];
        c.stability = Math.min(100, c.stability + 10);
        c.gdp = Math.round(c.gdp * 1.05);
        log("Resolution passed. " + c.name + " stability and GDP improved.");
      } else if (vote === "no") {
        Object.keys(countries).forEach(function(k) {
          const c = countries[k];
          if (c.relations[playerCountry]) c.relations[playerCountry] = Math.max(0, c.relations[playerCountry] - 3);
        });
        log("Resolution blocked. Minor relation hit with all nations.");
      }
      activeCrisis = null;
      render();
    }

    function openUN() {
      if (activeCrisis) {
        const banner = document.getElementById("crisis-banner");
        banner.classList.add("visible");
        log("UN session open. Active crisis: " + activeCrisis.title + " in " + countries[activeCrisis.center].name + ".");
      } else {
        log("UN General Assembly convened. No active crises. Security Council: USA, China, Russia, UK, France - any permanent member can veto.");
      }
    }

    function fetchNews() {
      const item = newsPool[Math.floor(Math.random() * newsPool.length)];
      log("NEWS: " + item.headline);
      item.countries.forEach(function(cid) {
        const c = countries[cid];
        if (!c) return;
        if (item.effect === "gdp_up") { c.gdp = Math.round(c.gdp * 1.03); }
        else if (item.effect === "gdp_down") { c.gdp = Math.round(c.gdp * 0.97); }
        else if (item.effect === "stability_up") { c.stability = Math.min(100, c.stability + 5); }
        else if (item.effect === "stability_down") { c.stability = Math.max(10, c.stability - 5); }
        else if (item.effect === "mil_up") { c.mil = Math.round(c.mil * 1.05); }
        else if (item.effect === "pop_down") { c.pop = Math.max(1, Math.round(c.pop * 0.98)); }
      });
      render();
    }

    function imposeSanctions() {
      if (!selectedTarget || selectedTarget === playerCountry) { log("Select a different country to sanction."); return; }
      const target = countries[selectedTarget];
      if (isSanctioned(selectedTarget)) { log(target.name + " is already under sanctions."); return; }
      activeSanctions.push({ target: selectedTarget, turns: 4 });
      target.stability = Math.max(10, target.stability - 5);
      log("SANCTIONS imposed on " + target.name + "! Income halved for 4 turns. They may retaliate.");
      if (Math.random() < 0.4) {
        const retaliators = Object.keys(countries).filter(function(k) {
          return countries[k].owner !== "You" && countries[k].relations[playerCountry] && countries[k].relations[playerCountry] < 40;
        });
        if (retaliators.length > 0) {
          const r = retaliators[Math.floor(Math.random() * retaliators.length)];
          activeTariffs.push({ target: r, turns: 3 });
          log(countries[r].name + " retaliated with tariffs on your exports!");
        }
      }
      render();
    }

    function imposeTariffs() {
      if (!selectedTarget || selectedTarget === playerCountry) { log("Select a different country to tariff."); return; }
      const target = countries[selectedTarget];
      if (isTariffed(selectedTarget)) { log(target.name + " is already tariffed."); return; }
      activeTariffs.push({ target: selectedTarget, turns: 3 });
      target.stability = Math.max(10, target.stability - 3);
      target.gdp = Math.round(target.gdp * 0.97);
      log("TARIFFS imposed on " + target.name + "! Their exports drop, your consumers pay more. Stability hit.");
      if (Math.random() < 0.5) {
        const retaliators = Object.keys(countries).filter(function(k) {
          return countries[k].owner !== "You" && Math.random() < 0.3;
        });
        retaliators.forEach(function(r) {
          if (!isTariffed(r) && !isSanctioned(r)) {
            activeTariffs.push({ target: r, turns: 3 });
            log("Trade war spark: " + countries[r].name + " hit back with counter-tariffs!");
          }
        });
      }
      render();
    }

    function nextTurn() {
      if (!playerCountry) { log("Select a country first by tapping it on the map."); return; }
      turn++;
      const p = countries[playerCountry];
      let income = Math.round(p.gdp * 0.05 * (p.stability / 100) + p.pop * 0.1);
      if (isSanctioned(playerCountry)) income = Math.round(income * 0.5);
      if (isTariffed(playerCountry)) { income = Math.round(income * 0.9); p.stability = Math.max(10, p.stability - 1); }
      money += income;
      p.budget += Math.round(income * 0.5);
      log("Turn " + turn + ": Economy generated +$" + income + "B. Total money: $" + money + "B");

      const rus = countries["RUS"];
      const ukr = countries["UKR"];
      if (rus && ukr) {
        rus.mil = Math.max(10, rus.mil - 2);
        rus.stability = Math.max(10, rus.stability - 1);
        rus.gdp = Math.round(rus.gdp * 0.998);
        if (Math.random() < 0.6) ukr.mil = Math.max(5, ukr.mil - 1);
        ukr.mil = Math.min(ukr.mil + 2, 60);
        ukr.budget += 15;
        rus.conflict = true; ukr.conflict = true;
        rus.conflictLoss = 2; ukr.conflictLoss = 1;
      }

      const irn = countries["IRN"];
      const usa = countries["USA"];
      if (irn && usa) {
        irn.gdp = Math.round(irn.gdp * 0.985);
        irn.stability = Math.max(10, irn.stability - 1);
        irn.conflict = true; irn.conflictLoss = 1;
        if (Math.random() < 0.15) {
          irn.mil = Math.max(10, irn.mil - 3);
          usa.mil = Math.max(50, usa.mil - 1);
          log("US-IRAN military flare-up! Iran lost forces, US took minor losses.");
        }
      }

      activeSanctions = activeSanctions.filter(function(s) {
        s.turns--;
        const c = countries[s.target];
        if (c) {
          c.gdp = Math.round(c.gdp * 0.95);
          c.stability = Math.max(10, c.stability - 2);
          if (Math.random() < 0.3) {
            activeTariffs.push({ target: s.target, turns: 2 });
            log(c.name + " broke sanctions illegally - short-term boost, reputation tanked.");
            c.gdp = Math.round(c.gdp * 1.08);
            Object.keys(countries).forEach(function(k) {
              if (countries[k].relations[playerCountry]) countries[k].relations[playerCountry] = Math.max(0, countries[k].relations[playerCountry] - 5);
            });
          }
        }
        if (s.turns <= 0) {
          log("Sanctions on " + (c ? c.name : s.target) + " expired.");
          return false;
        }
        return true;
      });

      activeTariffs = activeTariffs.filter(function(t) {
        t.turns--;
        const c = countries[t.target];
        if (c) {
          c.gdp = Math.round(c.gdp * 0.98);
          c.stability = Math.max(10, c.stability - 1);
        }
        if (t.turns <= 0) {
          log("Tariffs on " + (c ? c.name : t.target) + " expired.");
          return false;
        }
        return true;
      });

      Object.keys(countries).forEach(function(k) {
        const c = countries[k];
        if (c.owner !== "You") {
          let aiIncome = Math.round(c.income || (c.gdp * 0.01));
          if (isSanctioned(k)) aiIncome = Math.round(aiIncome * 0.5);
          if (isTariffed(k)) aiIncome = Math.round(aiIncome * 0.9);
          c.budget += aiIncome;
          if (Math.random() < 0.3) c.mil = Math.round(c.mil * 1.02);
          if (c.conflict) c.mil = Math.max(5, c.mil - c.conflictLoss);
        }
      });

      if (activeCrisis && turn > activeCrisis.expires) {
        log("UN resolution on " + activeCrisis.title + " expired without action. Slight relation shift.");
        Object.keys(countries).forEach(function(k) {
          const c = countries[k];
          if (c.relations[playerCountry]) c.relations[playerCountry] = Math.max(0, c.relations[playerCountry] - 2);
        });
        const c = countries[activeCrisis.center];
        c.gdp = Math.round(c.gdp * 0.95);
        c.pop = Math.max(1, Math.round(c.pop * 0.97));
        activeCrisis = null;
        document.getElementById("crisis-banner").classList.remove("visible");
      }

      crisisCooldown--;
      if (!activeCrisis && crisisCooldown <= 0 && Math.random() < 0.2) {
        generateCrisis();
        crisisCooldown = 5 + Math.floor(Math.random() * 4);
      }

      render();
    }

    function investMilitary() {
      if (!playerCountry || money < 50) { log("Need a country and at least $50B."); return; }
      money -= 50;
      const p = countries[playerCountry];
      p.mil = Math.round(p.mil * 1.08);
      const branches = ["navy", "air", "army"];
      p.branch = branches[Math.floor(Math.random() * branches.length)];
      log("Invested $50B in military. Power increased, now emphasizing " + (p.branch === "navy" ? "Navy" : (p.branch === "air" ? "Air Force" : "Army")) + ".");
      render();
    }

    function claimCountry() {
      if (!selectedTarget || selectedTarget === playerCountry) { log("Select a different country to claim."); return; }
      const c = countries[selectedTarget];
      if (!c || c.owner) { log("That country is already controlled."); return; }
      const cost = claimCost(c.gdp);
      if (money < cost) { log("Need $" + cost + "B to claim " + c.name + ". You have $" + money + "B."); return; }
      money -= cost;
      c.owner = "You";
      log("CLAIMED " + c.name + " for $" + cost + "B. Remaining: $" + money + "B.");
      selectedTarget = null;
      render();
      showStats(c.id);
    }

    function attack() {
      if (!playerCountry || !selectedTarget || selectedTarget === playerCountry) { log("Select a different country to attack."); return; }
      const attacker = countries[playerCountry];
      const defender = countries[selectedTarget];
      const atkPower = attacker.mil * (attacker.stability / 100);
      const defPower = defender.mil * (defender.stability / 100) * 1.2;
      if (atkPower > defPower * 0.7) {
        defender.owner = "You";
        defender.mil = Math.round(defender.mil * 0.6);
        attacker.mil = Math.round(attacker.mil * 0.85);
        log("Victory! You captured " + defender.name + " for $" + claimCost(defender.gdp) + "B. Losses sustained.");
      } else {
        attacker.mil = Math.round(attacker.mil * 0.7);
        log("Attack on " + defender.name + " failed. Your forces weakened.");
      }
      render();
    }

    function diplomacy() {
      if (!selectedTarget) { log("Select a country for diplomacy."); return; }
      const t = countries[selectedTarget];
      if (!t.relations) t.relations = {};
      if (Math.random() > 0.5) {
        t.stability = Math.min(100, t.stability + 5);
        t.relations[playerCountry] = (t.relations[playerCountry] || 40) + 10;
        log("Diplomatic success with " + t.name + ". Relations improved.");
      } else {
        log("Diplomacy with " + t.name + " stalled.");
      }
      render();
    }

    function research() {
      if (money < 100) { log("Need $100B for research."); return; }
      money -= 100;
      const p = countries[playerCountry];
      p.mil = Math.round(p.mil * 1.15);
      p.stability = Math.min(100, p.stability + 3);
      log("Research breakthrough! Military and stability boosted.");
      render();
    }

    map = L.map("map", { zoomSnap: 0.25, worldCopyJump: true }).setView([20, 0], 2);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      attribution: "Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community",
      maxZoom: 18
    }).addTo(map);

    fetch(GEOJSON_URL)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        geoLayer = L.geoJSON(data, { style: styleFeature, onEachFeature: onEachFeature }).addTo(map);
        map.fitBounds(geoLayer.getBounds());
        updateMilIcons();
        log("Map loaded with " + Object.keys(countries).length + " countries. Tap one to start.");
        log("Russia-Ukraine war LIVE. US-Iran standoff active. UN crises, News, Sanctions, Tariffs, and military icons ready.");
      })
      .catch(function(err) {
        log("Failed to load map data: " + err.message);
      });
  </script>
</body>
</html>
